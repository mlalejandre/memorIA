name: Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar el paquete (editable)
        run: python -m pip install -e .
      - name: Comprobar sintaxis
        run: python -m compileall -q src interfaz tests benchmarks scripts
      - name: Ejecutar tests unitarios
        run: python -m unittest discover -s tests -v

  benchmark-emulado:
    # Valida la logica del pipeline con LLM/embeddings simulados. No mide calidad semantica.
    # continue-on-error: es informativo; quita la linea cuando quieras que bloquee.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python benchmarks/prueba.py --json informe.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: informe-benchmark
          path: informe.json
